[package]
name = "ytrs"
version = "0.3.0"
edition = "2024"
description = "High-performance yt-dlp wrapper with social media optimization"
license = "MIT"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util"] }
url = "2.5.8"
colored = "3.1.1"
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
which = "8.0.5"
futures = "0.3.33"
thiserror = "2.0.19"